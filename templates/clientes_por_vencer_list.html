{% extends "base.html" %}

{% block head %}
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/1.13.7/css/jquery.dataTables.min.css">
    <style>
        .input-status { width: 100px; }
        .status-select { min-width: 110px; font-size: 0.85rem; }
        /* Estilo para que los botones de WA se vean compactos */
        .btn-group-wa .btn { padding: 0.2rem 0.4rem; font-size: 0.75rem; }
    </style>
{% endblock %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row">
        <div class="col-12">
          <h2 class="mb-4">Clientes por vencer (+- próximos 15 días)</h2>
            <div class="card mb-4">
                <div class="card-body px-0 pt-0 pb-2">
                    <div class="card p-3 mb-3 bg-light">
                        <div class="row g-3">
                            <div class="col-md-3">
                                <label for="filtroTipo" class="form-label">Tipo de Cliente</label>
                                <select id="filtroTipo" class="form-select form-select-sm">
                                    <option value="">Todos</option>
                                    <option value="PAGO">Solo PAGO</option>
                                    <option value="DEMO">Solo DEMO</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label for="filtroMonth" class="form-label">Mes Vencimiento</label>
                                <select id="filtroMonth" class="form-select form-select-sm">
                                    <option value="">Todos</option>
                                    {% for month_num, month_name in meses %}
                                    <option value="{{ month_num }}">{{ month_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-3 d-flex align-items-end">
                                <button id="btn_reset_filtros" class="btn btn-sm btn-outline-danger">
                                    <i class="fa-solid fa-filter-circle-xmark"></i> Borrar filtros
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="table-responsive px-2">
                        <table class="table align-items-center mb-0" id="tablaClientesPorVencer">
                            <thead>
                                <tr>
                                    <th class="card-header text-center">Server</th>
                                    <th class="card-header text-center">Tipo</th>
                                    <th class="card-header">Negocio</th>
                                    <th class="card-header">Contacto / Mail</th> 
                                    <th class="card-header">Teléfonos</th>
                                    <th class="card-header text-center">Seguimiento WA</th> 
                                    <th class="card-header text-center">Status</th>
                                    <th class="card-header">Paquete</th>
                                    <th class="card-header">RFC/NIT</th>
                                    <th class="card-header text-center">Vence En</th>
                                    <th class="card-header text-center">Acciones</th>
                                </tr>
                            </thead>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block custom_scripts %}
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="text/javascript" charset="utf8" src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/dataTables.buttons.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.2/js/buttons.print.min.js"></script>

<script>
$(document).ready(function() {
    let dtClientesPorVencer;

    // 🛑 FUNCIÓN GLOBAL PARA EL MODAL DE PAGO 🛑
    window.abrirModalPago = async function(clienteId) {
        try {
            const resp = await fetch(`/api/cliente_pago/${clienteId}`);
            const info = await resp.json();
            if (!info.ok) { Swal.fire('Error', 'No se pudo cargar la info.', 'error'); return; }

            const d = info.data;
            const rfcDisplay = d.rfc ? 
                `<span class="badge bg-secondary">RFC/NIT: ${d.rfc}</span>` : 
                `<span class="badge bg-danger">SIN RFC</span>`;
            
            const ultimoPagoHtml = d.ultimo_pago_info ? 
                `<div class="small text-muted mt-2">Historial: <b>${d.ultimo_pago_info}</b></div>` : '';

            const opcionesPaquete = d.paquetes.map(p =>
                `<option value="${p.id}" data-precio="${p.precio}" ${p.id === d.paquete_id_actual ? 'selected' : ''}>
                    ${p.nombre} – ${p.vigencia} (${p.moneda} ${Number(p.precio).toFixed(2)})
                </option>`
            ).join('');

            const { value: formValues } = await Swal.fire({
                title: `Registrar Pago`,
                width: 700,
                html: `
                    <div class="mb-1 text-center">
                        <h4 class="mb-0 text-primary">${d.negocio}</h4>
                        ${rfcDisplay}
                        ${ultimoPagoHtml}
                    </div>
                    <hr>
                    <div class="text-start">
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Fecha de pago *</label>
                                <input type="date" id="swal_fecha_pago" class="form-control" value="${new Date().toISOString().split('T')[0]}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold small">Método de pago *</label>
                                <select id="swal_metodo_pago" class="form-select">
                                    <option value="Transferencia">Transferencia</option>
                                    <option value="Depósito">Depósito</option>
                                    <option value="Mercado Pago">Mercado Pago</option>
                                    <option value="Nequi">Nequi</option>
                                    <option value="Otro">Otro</option>
                                </select>
                            </div>
                        </div>

                        <label class="form-label mt-3 fw-bold small">Paquete / Plan *</label>
                        <select id="swal_paquete" class="form-select">${opcionesPaquete}</select>

                        <label class="form-label mt-3 fw-bold small">Monto total pagado</label>
                        <input type="number" id="swal_monto" class="form-control text-end fw-bold" step="0.01" style="font-size: 1.2rem;">

                        <div id="div_motivo_descuento" class="mt-3 p-2 border rounded bg-warning bg-opacity-10 d-none">
                            <label class="form-label fw-bold text-danger small mb-1">
                                <i class="fa-solid fa-tag"></i> Motivo del Descuento / Ajuste
                            </label>
                            <textarea id="swal_motivo_descuento" class="form-control form-control-sm" placeholder="Justifica por qué el monto es menor al precio de lista..."></textarea>
                        </div>

                        <div class="form-check form-switch mt-4 p-2 border rounded bg-light">
                            <input class="form-check-input ms-0 me-2" type="checkbox" id="swal_por_facturar">
                            <label class="form-check-label fw-bold text-danger" for="swal_por_facturar">
                                <i class="fa-solid fa-file-invoice-dollar"></i> ¿ESTE PAGO ES POR FACTURAR?
                            </label>
                        </div>
                    </div>
                `,
                showCancelButton: true,
                confirmButtonText: 'Guardar Pago',
                confirmButtonColor: '#198754',
                didOpen: () => {
                    const $paquete = $('#swal_paquete');
                    const $monto = $('#swal_monto');
                    const $divMotivo = $('#div_motivo_descuento');
                    const $txtMotivo = $('#swal_motivo_descuento');

                    const validarDescuento = () => {
                        const precioLista = parseFloat($paquete.find(':selected').data('precio')) || 0;
                        const montoIngresado = parseFloat($monto.val()) || 0;
                        if (montoIngresado < precioLista) {
                            $divMotivo.removeClass('d-none').hide().fadeIn();
                        } else {
                            $divMotivo.fadeOut(() => $txtMotivo.val(''));
                        }
                    };

                    $paquete.on('change', function() {
                        $monto.val($(this).find(':selected').data('precio'));
                        validarDescuento();
                    });
                    $monto.on('input', validarDescuento);

                    // Inicialización
                    $monto.val($paquete.find(':selected').data('precio'));
                    validarDescuento();
                },
                preConfirm: () => {
                    const fecha = document.getElementById('swal_fecha_pago').value;
                    const paquete = $('#swal_paquete').val();
                    const monto = $('#swal_monto').val();
                    const motivo = $('#swal_motivo_descuento').val();

                    if (!fecha || !paquete || !monto) {
                        Swal.showValidationMessage('Campos obligatorios faltantes');
                        return false;
                    }

                    // Obligar motivo si hay descuento
                    const precioLista = parseFloat($('#swal_paquete').find(':selected').data('precio')) || 0;
                    if (parseFloat(monto) < precioLista && !motivo.trim()) {
                        Swal.showValidationMessage('Indica el motivo del descuento');
                        return false;
                    }

                    return {
                        fecha_pago: fecha,
                        paquete_id: paquete,
                        metodo_pago: $('#swal_metodo_pago').val(),
                        monto: monto,
                        motivo_descuento: motivo,
                        por_facturar: document.getElementById('swal_por_facturar').checked
                    };
                }
            });

            if (formValues) {
                const respPago = await fetch('/api/pagos/nuevo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cliente_id: clienteId, ...formValues })
                });
                const res = await respPago.json();
                if (res.ok) {
                    Swal.fire({ icon: 'success', title: '¡Éxito!', timer: 1500, showConfirmButton: false });
                    dtClientesPorVencer.ajax.reload(null, true);
                } else {
                    Swal.fire('Error', res.error, 'error');
                }
            }
        } catch (err) { console.error(err); }
    };

    function loadTable() {
        if ($.fn.DataTable.isDataTable('#tablaClientesPorVencer')) {
            dtClientesPorVencer.destroy();
        }

        dtClientesPorVencer = $('#tablaClientesPorVencer').DataTable({
            ajax: {
                url: "{{ url_for('api_clientes_por_vencer_dt') }}",
                data: function (d) { d.month = $('#filtroMonth').val(); },
                dataSrc: 'data'
            },
            pageLength: 50,
            dom: 'lBfrtip',
            buttons: [
                {
                    extend: 'excelHtml5',
                    text: '<i class="fa-solid fa-file-excel"></i> Exportar Excel',
                    className: 'btn btn-outline-success btn-sm mb-3',
                    title: 'Clientes_Por_Vencer_' + new Date().toLocaleDateString(),
                    exportOptions: { 
                        columns: [0, 1, 2, 3, 4, 6, 7, 8, 9] // Excluimos Seguimiento WA (5) y Acciones (10)
                    }
                },
                {
                    extend: 'print',
                    text: '<i class="fa-solid fa-print"></i> Imprimir Lista',
                    className: 'btn btn-outline-dark btn-sm mb-3',
                    exportOptions: { 
                        columns: [0, 1, 2, 3, 4, 6, 7, 8, 9]
                    }
                }
            ],
            language: {
                "decimal": "",
                "emptyTable": "No hay información",
                "info": "Mostrando _START_ a _END_ de _TOTAL_ entradas",
                "infoEmpty": "Mostrando 0 a 0 de 0 entradas",
                "infoFiltered": "(Filtrado de _MAX_ entradas totales)",
                "infoPostFix": "",
                "thousands": ",",
                "lengthMenu": "Mostrar _MENU_ entradas",
                "loadingRecords": "Cargando...",
                "processing": "Procesando...",
                "search": "Buscar:",
                "zeroRecords": "Sin resultados encontrados",
                "paginate": {
                    "first": "Primero",
                    "last": "Último",
                    "next": "Siguiente",
                    "previous": "Anterior"
                }
            },
            columns: [
                { data: 'server', className: 'text-center' },
                { 
                    data: 'es_demo',
                    className: 'text-center',
                    render: function(data, type, row) {
                        // 'type' nos dice si DataTables está dibujando (display) o buscando (filter)
                        const label = data ? 'DEMO' : 'PAGO';
                        
                        if (type === 'display') {
                            let color = data ? 'info text-dark' : 'primary';
                            return `<span class="badge bg-${color}">${label}</span>`;
                        }
                        // Para el filtro, devolvemos solo la palabra limpia
                        return label;
                    }
                },
                { data: 'negocio', render: (data, type, row) => `<a href="/clientes/${row.id}/detalle" class="fw-bold text-decoration-none">${data}</a>` },
                { 
                    data: 'nombre_contacto',
                    render: (data, type, row) => `<div class="fw-bold">${data}</div><div class="small text-muted">${row.mail || '--'}</div>`
                },
                { 
                    data: 'telefonos_display',
                    render: function(data, type, row) {
                        if (!data) return '--';
                        const listaTels = data.split(',');
                        let html = '';
                        listaTels.forEach(tel => {
                            const numLimpio = tel.trim();
                            if (numLimpio) {
                                html += `<div class="mb-1"><a href="https://api.whatsapp.com/send?phone=${numLimpio}" target="_blank" class="text-decoration-none fw-bold text-success small"><i class="fa-brands fa-whatsapp"></i> ${numLimpio}</a></div>`;
                            }
                        });
                        return html || '--';
                    }
                },
                {
                    data: null,
                    className: 'text-center',
                    render: function(data, type, row) {
                        const todosLosNumeros = row.telefonos_display ? row.telefonos_display.split(',') : []; 
                        if (todosLosNumeros.length === 0 || !todosLosNumeros[0]) return '--';
                        const num = todosLosNumeros[0].trim(); 
                        const f_vence = row.vence_en_display.replace(/<[^>]*>?/gm, '');
                        const nivelGuardado = row.wa_nivel_seguimiento || 0; 
                        let msgs = row.es_demo ? [
                            `Hola ${row.negocio}, ¿cómo va todo? ¿qué te ha parecido Gumi?, ¿tienes alguna duda con la que pueda apoyarte? Recuerda que tu demo vence el ${f_vence}.`,
                            `¡Hola Hola! ¿Te ha gustado Gumi? ¿Qué has pensado, te gustaría contratar? Recuerda que tu demo vence el ${f_vence}. ¿Contratamos?`,
                            `¡Es hoy, es hoy! ${row.negocio}, ¿estás listo para contratar Gumi?, hoy vence tu demo, ¿qué has decidido?`
                        ] : [
                            `Recordatorio amable: Tu pago vence el ${f_vence}.`,
                            `Hola ${row.negocio}, tu suscripción vence el ${f_vence}.`,
                            `URGENTE: Pago vencido o por vencer (${f_vence}). Confirma pago.`
                        ];
                        let html = '<div class="btn-group btn-group-wa shadow-sm">';
                        msgs.forEach((m, i) => {
                            const nivelBoton = i + 1;
                            const yaEnviado = nivelGuardado >= nivelBoton;
                            const btnClass = yaEnviado ? 'btn-success' : 'btn-outline-success';
                            const icono = yaEnviado ? 'fa-solid fa-check' : 'fa-brands fa-whatsapp';
                            html += `<a href="https://api.whatsapp.com/send?phone=${num}&text=${encodeURIComponent(m)}" target="_blank" onclick="registrarEnvioWA(${row.id}, ${nivelBoton})" class="btn btn-sm ${btnClass}" title="Nivel ${nivelBoton}"><i class="${icono}"></i> ${nivelBoton}</a>`;
                        });
                        return html + '</div>';
                    }
                },
                { 
                    data: 'status', 
                    className: 'text-center', 
                    render: function(d, type, row) {
                        // Determinamos el color
                        let textClass = d === 'Activo' ? 'text-success' : 'text-warning';
                        let html = `<div class="small fw-bold ${textClass}">${d}</div>`;
                        
                        // 🟢 NUEVO: Si hay fecha de status, la ponemos debajo en gris muy pequeño
                        if (row.fecha_status) {
                            html += `<div style="font-size: 0.6rem; color: #adb5bd; line-height: 1;">
                                        Desde: ${row.fecha_status}
                                    </div>`;
                        }
                        return html;
                    }
                },
                { data: 'paquete_nombre', className: 'small' },
                { 
                    data: 'rfc', 
                    className: 'small text-center',
                    render: data => data ? `<span class="badge bg-light text-dark border">${data}</span>` : '<span class="text-muted small">--</span>'
                },
                { data: 'vence_en_display', className: 'text-center' },
                {
                    data: 'id',
                    className: 'text-center',
                    render: id => `<button class="btn btn-sm btn-success" onclick="abrirModalPago(${id})"><i class="fa-solid fa-coins"></i></button>`
                }
            ]
        });
    }

    loadTable();

    // Filtros y Reset
    $('#filtroTipo').on('change', function() { 
        // Usamos el índice 1 (Columna Tipo) 
        // y aplicamos una búsqueda exacta para que no mezcle palabras
        const val = $(this).val();
        dtClientesPorVencer.column(1).search(val ? `^${val}$` : '', true, false).draw(); 
    });
    $('#filtroMonth').on('change', loadTable);
    $('#btn_reset_filtros').on('click', function() { $('#filtroTipo, #filtroMonth').val(''); loadTable(); });

    // Función de seguimiento WA
    window.registrarEnvioWA = function(clienteId, nivel) {
        fetch(`/api/cliente/marcar_wa/${clienteId}/${nivel}`, { method: 'POST' })
        .then(response => response.json())
        .then(data => { if (data.ok) dtClientesPorVencer.ajax.reload(null, false); })
        .catch(err => console.error("Error ESD Tracking:", err));
    };
});
</script>
{% endblock %}
