{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="card p-4 shadow-sm">
        <h2 class="mb-4">Pagos Registrados</h2>

        <div class="card p-3 mb-3 bg-light">
            <div class="row g-3">
                <div class="col-md-3">
                    <label for="filtro_year" class="form-label">Filtrar por Año</label>
                    <select id="filtro_year" class="form-select">
                        <option value="">Todos los años</option>
                        {% for year in unique_years %}
                            <option value="{{ year }}">{{ year }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label for="filtro_month" class="form-label">Filtrar por Mes</label>
                    <select id="filtro_month" class="form-select">
                        <option value="">Todos los meses</option>
                        {% for num, nombre in months_map.items() %}
                            <option value="{{ num }}">{{ nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button class="btn btn-secondary w-100 me-2" id="btn_reset_filtros">Limpiar Filtros</button>
                    <button class="btn btn-success w-100" onclick="abrirModalPagoGlobal()">
                        <i class="fa-solid fa-plus-circle me-1"></i> Agregar Pago
                    </button>
                </div>
            </div>
        </div>

        <div class="alert alert-secondary d-flex justify-content-between align-items-center py-2 mb-3">
            <span class="fw-bold"><i class="fa-solid fa-chart-line me-2"></i>Resumen de los registros visibles:</span>
            <span class="fs-5">
                Total Pagado: <span class="badge bg-success fs-5" id="totalMontoGlobal">$ 0.00</span>
            </span>
        </div>
        
        <div class="table-responsive mt-3">
            <table id="tablaPagos" class="table table-striped table-hover align-middle">
                <thead class="table-primary">
                    <tr>
                        <th class="text-center">Fecha</th>
                        <th>Negocio</th>
                        <th>Paquete / Vigencia</th>
                        <th class="text-end">Monto / Método</th>
                        <th class="text-center">Status Banco</th> <th class="text-center">RFC / NIT</th>
                        <th class="text-center"># Factura</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block custom_scripts %}
<script>

    function formatearFecha(f) {
        if (!f || f === '—') return '—';
        // Asumiendo que f viene como YYYY-MM-DD
        const partes = f.split('-');
        if (partes.length !== 3) return f;
        return `${partes[2]}/${partes[1]}/${partes[0].substring(2)}`; // Retorna DD/MM/YY
    }


    let tablaPagos;
    const USER_ROLE = '{{ current_user.role }}';
    const CAN_MODIFY = USER_ROLE === 'SUPERADMIN' || USER_ROLE === 'ADMIN';

    // 🛑 FUNCIÓN AJAX PARA GUARDAR FACTURA 🛑
    async function updateFactura(pagoId, newNumber, dt) {
        if (!CAN_MODIFY) return;
        try {
            const resp = await fetch(`/api/pago/${pagoId}/factura`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ numero_factura: newNumber })
            });
            const data = await resp.json();
            if (!data.ok) {
                Swal.fire('Error', data.error || 'No se pudo guardar la factura.', 'error');
                dt.ajax.reload(null, false);
            }
        } catch (e) {
            console.error("Error factura:", e);
        }
    }

    $(function() {
        function actualizarTotalGlobal(api) {
        const data = api.rows({ search: 'applied' }).data();
        let totalEnMXN = 0.0;

        // Tasas de cambio promedio (Ajusta estos valores según prefieras)
        const TASAS = {
            'MXN': 1.0,
            'USD': 20.00,    // 1 USD = 20 MXN
            'COP': 0.0048,   // 1,000 COP = 4.8 MXN aprox
            'PEN': 5.30      // 1 PEN = 5.3 MXN
        };

        data.each(function(row) {
            // 1. Extraer monto (asegurando que sea número)
            let monto = parseFloat(row.monto) || 0;
            
            // 2. Extraer moneda y limpiar espacios
            let monedaRaw = row.moneda ? String(row.moneda) : 'MXN';
            let moneda = monedaRaw.trim().toUpperCase();
            
            // 3. Aplicar conversión
            let tasa = TASAS[moneda] || 1.0;
            totalEnMXN += (monto * tasa);
        });

        // 4. Actualizar el elemento en el HTML
        $('#totalMontoGlobal').html(`
            <div class="text-end">
                <span style="font-size: 0.7rem; display: block; opacity: 0.8; line-height: 1;">Equivalencia Estimada</span>
                $ ${totalEnMXN.toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} MXN
            </div>
        `);
    }

        function loadPagosTable(year = '', month = '') {
            // FIX: Usamos el ID correcto de la tabla definido en tu HTML
            if ($.fn.DataTable.isDataTable('#tablaPagos')) {
                tablaPagos.destroy();
            }

            tablaPagos = $('#tablaPagos').DataTable({
                processing: true,
                serverSide: false, 
                pageLength: 100,
                lengthMenu: [[10, 25, 50, 100, -1], [10, 25, 50, 100, 'Todos']],
                dom: 'lBfrtip',
                buttons: [
                    { extend: 'excelHtml5', text: '<i class="fa-solid fa-file-excel"></i> Excel', className: 'btn btn-outline-success btn-sm' },
                    { extend: 'print', text: '<i class="fa-solid fa-print"></i> Imprimir', className: 'btn btn-outline-dark btn-sm' }
                ],
                ajax: {
                    url: "{{ url_for('api_pagos_dt_global') }}",
                    type: "GET",
                    data: function (d) { d.year = year; d.month = month; },
                    dataSrc: 'data'
                },
                // ... dentro de la configuración de DataTable en pagos_list.html ...
            columns: [
                { 
                    data: 'fecha_pago_iso', 
                    className: 'text-center',
                    render: function(data, type, row) {
                        // 'display' es lo que ve el usuario
                        if (type === 'display') {
                            return formatearFecha(data); 
                        }
                        // 'sort' y 'type' es lo que usa DataTables para ordenar
                        // Devolvemos el valor original (YYYY-MM-DD) para que el orden cronológico sea real
                        return data; 
                    }
                },
                { 
                    data: 'negocio_link',
                    render: (data, type, row) => `<div class="fw-bold">${data || row.negocio}</div>`
                },
                { 
                    data: 'paquete',
                    render: (data, type, row) => `<div>${data}</div><div class="small text-muted italic">${row.vigencia || ''}</div>`
                },
                { 
                    data: 'monto', 
                    className: 'text-end',
                    render: function(data, type, row) {
                        const monto = parseFloat(data).toLocaleString('es-MX', { minimumFractionDigits: 2 });
                        return `<div class="fw-bold">${row.moneda} ${monto}</div>
                                <div class="small text-muted" style="font-size: 0.75rem;">${row.metodo_pago}</div>`;
                    }
                },
                // 🟢 NUEVA COLUMNA: STATUS BANCO (ESD Protocol)
                {
                    data: 'bank_transaction_id',
                    className: 'text-center',
                    render: function(data) {
                        if (data === null || data === undefined || data === '' || data === 0) {
                            return `<span class="badge rounded-pill bg-secondary bg-opacity-75" style="font-size: 0.7rem;">
                                        <i class="fa-solid fa-clock me-1"></i> PENDIENTE
                                    </span>`;
                        } else {
                            return `<span class="badge rounded-pill bg-success" style="font-size: 0.7rem;">
                                        <i class="fa-solid fa-circle-check me-1"></i> CONCILIADO
                                    </span>`;
                        }
                    }
                },
                { data: 'rfc', className: 'text-center small' },
                { 
                    data: 'num_factura',
                    className: 'text-center',
                    render: function(data, type, row) {
                        const numFactura = (data || '').trim();
                        const disabledAttr = CAN_MODIFY ? '' : 'disabled';
                        
                        // 🟢 VALIDACIÓN ESD DE AMPLIO ESPECTRO:
                        // Captura: 1, "1", true, "true"
                        const requiereFactura = row.factura_pago == 1 || row.factura_pago === true || String(row.factura_pago).toLowerCase() === 'true';
                        const estaVacio = numFactura === '';
                        
                        let placeholder = "";
                        let styleExtra = "width:105px; text-align:center; transition: all 0.2s;";
                        
                        if (requiereFactura && estaVacio) {
                            placeholder = "POR FACTURAR";
                            // 🛑 FORZAMOS EL ESTILO CON !IMPORTANT
                            styleExtra += " border: 2px solid #dc3545 !important; background-color: #fff8f8 !important; color: #dc3545 !important; font-weight: bold;";
                        }

                        return `<input type="text" 
                                    class="form-control form-control-sm input-factura-inline mx-auto" 
                                    value="${numFactura}" 
                                    placeholder="${placeholder}"
                                    data-id="${row.id}" 
                                    style="${styleExtra}" 
                                    ${disabledAttr}>`;
                    }
                },
                { 
                    data: 'id',
                    className: 'text-center',
                    render: id => `<a href="/pago/${id}/comprobante" target="_blank" class="btn btn-sm btn-outline-secondary"><i class="fa-solid fa-file-pdf"></i></a>`
                }
            ],
                order: [[0, 'desc']],
                language: { url: '//cdn.datatables.net/plug-ins/1.13.7/i18n/es-ES.json' },
                drawCallback: function() {
                    actualizarTotalGlobal(this.api());
                }
            });
        }

        // Listener para guardado in-line
        $('#tablaPagos').on('blur', '.input-factura-inline', function() {
            const input = $(this);
            const valor = input.val().trim();
            
            // 🟢 Mejora ESD: Si el usuario escribió algo, quitamos el estilo de "Alerta"
            if (valor !== "") {
                input.css({
                    "border": "1px solid #ced4da",
                    "background-color": "#fff"
                });
            } else {
                // Si lo borró y requiere factura, podrías devolver el rojo aquí si quisieras
            }
            
            updateFactura(input.data('id'), valor, tablaPagos);
        });
        
        loadPagosTable();

        $('#filtro_year, #filtro_month').on('change', function() {
            loadPagosTable($('#filtro_year').val(), $('#filtro_month').val());
        });
        
        $('#btn_reset_filtros').on('click', function() {
            $('#filtro_year, #filtro_month').val('');
            loadPagosTable();
        });
    });

    async function abrirModalPagoGlobal() {
        const { value: formValues } = await Swal.fire({
            title: 'Registrar Nuevo Pago',
            width: 700,
            html: `
                <div class="text-start">
                    <label class="form-label fw-bold">1. Seleccionar Negocio / Cliente</label>
                    <select id="swal_cliente_id" class="form-select" style="width: 100%"></select>
                    
                    <div id="info_historial_cliente" class="mt-2 text-center"></div>

                    <div id="container_detalle_pago" class="mt-3 d-none">
                        <hr>
                        <div class="row">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Fecha de pago *</label>
                                <input type="date" id="swal_fecha_pago" class="form-control" value="${new Date().toISOString().split('T')[0]}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Método de pago *</label>
                                <select id="swal_metodo" class="form-select">
                                    <option value="Transferencia">Transferencia</option>
                                    <option value="Depósito">Depósito</option>
                                    <option value="Mercado Pago">Mercado Pago</option>
                                    <option value="Nequi">Nequi</option>
                                    <option value="Otro">Otro</option>
                                </select>
                            </div>
                        </div>

                        <label class="form-label mt-3 fw-bold">Paquete / Plan * (Auto-detectado)</label>
                        <select id="swal_paquete" class="form-select"></select>

                        <label class="form-label mt-2 fw-bold">Monto total</label>
                        <input type="number" id="swal_monto" class="form-control text-end fw-bold" step="0.01" style="font-size: 1.2rem;">

                        <div id="div_motivo_descuento" class="mt-3 p-2 border rounded bg-warning bg-opacity-10 d-none">
                            <label class="form-label fw-bold text-danger small mb-1">
                                <i class="fa-solid fa-circle-exclamation"></i> Justificación del Descuento
                            </label>
                            <textarea id="swal_motivo_descuento" class="form-control form-control-sm" 
                                    placeholder="¿Por qué el monto es menor al precio de lista?"></textarea>
                        </div>

                        <div class="form-check form-switch mt-4 p-2 border rounded bg-light">
                            <input class="form-check-input ms-0 me-2" type="checkbox" id="swal_por_facturar">
                            <label class="form-check-label fw-bold text-danger" for="swal_por_facturar">
                                <i class="fa-solid fa-file-invoice-dollar"></i> ¿ESTE PAGO ES POR FACTURAR?
                            </label>
                        </div>
                    </div>
                </div>
            `,
            showCancelButton: true, // 🛑 1. Botón de cerrar/cancelar
            cancelButtonText: 'Cancelar',
            confirmButtonText: 'Guardar Pago',
            confirmButtonColor: '#198754',
            didOpen: () => {
                // Referencias a los elementos para usarlos en la validación
                const $paquete = $('#swal_paquete');
                const $monto = $('#swal_monto');
                const $divMotivo = $('#div_motivo_descuento');
                const $txtMotivo = $('#swal_motivo_descuento');

                // Función Inteligente de Validación
                const validarDescuento = () => {
                    const precioLista = parseFloat($paquete.find(':selected').data('precio')) || 0;
                    const montoIngresado = parseFloat($monto.val()) || 0;

                    if (montoIngresado < precioLista) {
                        $divMotivo.removeClass('d-none').hide().fadeIn();
                    } else {
                        $divMotivo.fadeOut(() => $txtMotivo.val(''));
                    }
                };

                $('#swal_cliente_id').select2({
                    dropdownParent: $('.swal2-container'),
                    placeholder: 'Escribe el nombre del negocio...',
                    minimumInputLength: 3,
                    ajax: {
                        url: '/api/clientes/search',
                        dataType: 'json',
                        processResults: data => ({ results: data.results })
                    }
                }).on('select2:select', async function(e) {
                    const clienteId = e.params.data.id;
                    const resp = await fetch(`/api/cliente_pago/${clienteId}`);
                    const info = await resp.json();
                    
                    if(info.ok) {
                        const d = info.data;
                        const rfcHtml = d.rfc ? `<span class="badge bg-secondary me-2">RFC: ${d.rfc}</span>` : `<span class="badge bg-danger me-2">SIN RFC</span>`;
                        const ultimoHtml = d.ultimo_pago_info ? `<div class="small text-muted mt-1">Último registro: <b>${d.ultimo_pago_info}</b></div>` : '';
                        $('#info_historial_cliente').html(rfcHtml + ultimoHtml);

                        $paquete.empty();
                        d.paquetes.forEach(p => {
                            const selected = (p.id == d.paquete_id_actual) ? 'selected' : '';
                            $paquete.append(`<option value="${p.id}" data-precio="${p.precio}" ${selected}>${p.nombre} (${p.moneda} ${p.precio})</option>`);
                        });
                        
                        $monto.val($paquete.find(':selected').data('precio'));
                        $('#container_detalle_pago').removeClass('d-none');
                        
                        // Validamos descuento inmediatamente después de cargar los datos del cliente
                        validarDescuento();
                    }
                });

                // Listeners para cambios manuales
                $paquete.on('change', function() {
                    $monto.val($(this).find(':selected').data('precio'));
                    validarDescuento();
                });

                $monto.on('input', validarDescuento);
            },
            preConfirm: () => {
                const clienteId = $('#swal_cliente_id').val();
                const fecha = document.getElementById('swal_fecha_pago').value;
                const paquete = $('#swal_paquete').val();
                const monto = document.getElementById('swal_monto').value;
                const motivo = document.getElementById('swal_motivo_descuento').value; // 🛑 NUEVO

                if (!clienteId || !fecha || !paquete || !monto) {
                    Swal.showValidationMessage('Completa los campos obligatorios');
                    return false;
                }

                // Validación extra: Si hay descuento, exigir motivo
                const precioLista = parseFloat($('#swal_paquete').find(':selected').data('precio')) || 0;
                if (parseFloat(monto) < precioLista && !motivo.trim()) {
                    Swal.showValidationMessage('Debes indicar el motivo del descuento');
                    return false;
                }

                return { 
                    cliente_id: clienteId, 
                    fecha_pago: fecha, 
                    paquete_id: paquete, 
                    monto, 
                    motivo_descuento: motivo, // 🛑 SE ENVÍA AL BACKEND
                    metodo_pago: $('#swal_metodo').val(), 
                    por_facturar: document.getElementById('swal_por_facturar').checked 
                };
            }
        });

        if (formValues) {
            const resp = await fetch('/api/pagos/nuevo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formValues)
            });
            const res = await resp.json();
            if (res.ok) {
                Swal.fire('¡Éxito!', 'Pago registrado', 'success');
                if(typeof tablaPagos !== 'undefined') tablaPagos.ajax.reload(null, false);
            }
        }
    }
</script>
{% endblock %}
